<!--
  IMPORTANT:
  This file is intentionally a normal browser HTML file.
  The previous version used JSX inside a normal type="module" script, which caused:
  SyntaxError: Unexpected token '<'
  This version uses Babel in-browser so JSX is valid.

  SECURITY:
  The key below is a Supabase PUBLISHABLE key. Never put a service_role/secret key
  in browser code. Privileged database/storage access must be protected by Supabase RLS
  or a server/Edge Function.

  NOTE ON THE PIN:
  The admin PIN is fixed to 0110 and the page now unlocks itself automatically on load
  (it calls the same Supabase PIN RPCs it always did, just without asking you to type
  anything). Because the PIN is visible in this file's source, it only keeps out casual
  visitors -- anyone who views source can read it. If this panel ever needs to resist a
  determined attacker, this is the first thing to change (move to real auth).
-->

<script type="text/babel" data-presets="env,react">
const SUPABASE_URL = "https://ilaetdddupayvtdaeewj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6HYx9w5kJkpytxuby9Ky3A_2vrsRpPA";
const STORAGE_BUCKET = "project-images";

const SESSION_HOURS = 8;
const IDLE_MS = 30 * 60 * 1000;
const LOCKOUT_KEY = "primecreatives_pin_lockout_v4";
const FAILCOUNT_KEY = "primecreatives_pin_failcount_v4";

// Fixed admin PIN. The panel auto-authenticates with this instead of asking you to type it.
const FIXED_PIN = "0110";

const { useState, useEffect, useRef, useCallback, useMemo } = React;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth:{persistSession:true,autoRefreshToken:true}
});

function getFailCount(){return Number(localStorage.getItem(FAILCOUNT_KEY)||"0");}
function bumpFail(){
  const fails=getFailCount()+1;
  localStorage.setItem(FAILCOUNT_KEY,String(fails));
  if(fails>=5){
    const until=Date.now()+10*60*1000;
    localStorage.setItem(LOCKOUT_KEY,String(until));
    return{lockedUntil:until,fails};
  }
  return{lockedUntil:null,fails};
}
function clearFails(){localStorage.removeItem(FAILCOUNT_KEY);localStorage.removeItem(LOCKOUT_KEY);}
function getLockoutUntil(){
  const v=localStorage.getItem(LOCKOUT_KEY);if(!v)return null;
  const n=Number(v);
  if(Date.now()>n){clearFails();return null}
  return n;
}
function clearToken(){/* no local admin token is cached; server session drives access */}

async function ensureAnonymousAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session)return session;
  const {data,error}=await sb.auth.signInAnonymously();
  if(error)throw new Error("Enable Anonymous Sign-Ins in Supabase Authentication first.");
  return data.session;
}

async function requireSession(){
  const {data,error}=await sb.rpc("admin_is_admin_session");
  if(error||data!==true)throw new Error("Admin is locked. Enter your PIN again.");
  return true;
}

async function logAccess(event,meta={}){
  try{await sb.rpc("admin_log_event",{p_event:event,p_meta:meta});}catch(e){}
}

async function unlockWithPin(pin){
  const {data,error}=await sb.rpc("admin_verify_pin",{p_pin:pin});
  if(error)throw error;
  return data===true;
}

async function setupPin(pin){
  const {data,error}=await sb.rpc("admin_setup_pin",{p_pin:pin});
  if(error)throw error;
  return data===true;
}

async function hasActiveAdminSession(){
  try{
    const {data,error}=await sb.rpc("admin_is_admin_session");
    if(error)return false;
    return data===true;
  }catch(e){return false}
}

async function logoutAdmin(){
  try{await sb.rpc("admin_logout");}catch(e){}
}

async function processImageFile(file){
  if(!file.type.startsWith("image/"))throw new Error("Unsupported image type");
  const bitmap=await createImageBitmap(file);
  let{width,height}=bitmap;const long=Math.max(width,height),short=Math.min(width,height);
  let scale=1;if(long>1800)scale=1800/long;else if(short>0&&short<1200)scale=1200/short;
  const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");if(!ctx){bitmap.close();throw new Error("Canvas unavailable")}
  ctx.drawImage(bitmap,0,0,w,h);bitmap.close();
  const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error("Image encoding failed")),"image/jpeg",.88));
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onload=()=>res({dataUrl:String(r.result)});r.onerror=()=>rej(new Error("Image read failed"));r.readAsDataURL(blob);
  });
}
async function uploadImage(dataUrl,prefix="uploads"){
  await requireSession();
  const raw=dataUrl.replace(/^data:[^;]+;base64,/,""),binary=atob(raw),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(bytes.byteLength>8*1024*1024)throw new Error("File too large (max 8 MB)");
  const path=`${prefix}/${crypto.randomUUID()}.jpg`;
  const {error}=await sb.storage.from(STORAGE_BUCKET).upload(path,bytes,{contentType:"image/jpeg",upsert:false});
  if(error)throw new Error(error.message||"Upload failed");
  return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}
function toast(msg,type="info"){
  const el=document.createElement("div");el.textContent=msg;
  el.className="fixed bottom-6 right-6 z-[9999] px-4 py-3 rounded-xl text-sm font-medium shadow-lg "+
    (type==="error"?"bg-red-600 text-white":type==="success"?"bg-emerald-600 text-white":"bg-[#1c1814] text-[#faf6f1] border border-white/10");
  document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
}

const VIEWS=[
  {id:"overview",label:"Overview"},{id:"projects",label:"Projects"},{id:"drafts",label:"Drafts"},
  {id:"web",label:"Web Projects"},{id:"experience",label:"Experience"},{id:"testimonials",label:"Testimonials"},
  {id:"blog",label:"Blog"},{id:"inbox",label:"Inbox"},{id:"services",label:"Services"},

];
const emptyProject=()=>({id:null,title:"",description:"",short_description:"",category:"Branding",
client_name:"",image_url:"",image_urls:[],tools_used:[],status:"draft",is_visible:true,featured:false,display_order:0});

function PinGate({onUnlock}){
  const[mode,setMode]=useState("loading"),[digits,setDigits]=useState(["","","",""]),
  [confirm,setConfirm]=useState(["","","",""]),[phase,setPhase]=useState("pin"),
  [shake,setShake]=useState(false),[busy,setBusy]=useState(false),
  [fails,setFails]=useState(getFailCount()),[lockUntil,setLockUntil]=useState(getLockoutUntil()),
  [now,setNow]=useState(Date.now()),refs=useRef([]);

  // On load: sign in anonymously, then try to unlock automatically with the fixed PIN.
  // Only fall back to showing the manual entry screen if that silently fails.
  useEffect(()=>{(async()=>{
    await ensureAnonymousAuth();

    // Already have a live admin session (e.g. quick reload) -> skip straight in.
    if(await hasActiveAdminSession()){
      clearFails();
      onUnlock();
      return;
    }

    const{data,error}=await sb.rpc("admin_has_pin");
    if(error)throw error;

    if(data===true){
      // PIN already exists on the backend -> auto-verify with the fixed PIN.
      try{
        const ok=await unlockWithPin(FIXED_PIN);
        if(ok){clearFails();onUnlock();return;}
      }catch(e){ /* fall through to manual unlock screen */ }
      setMode("unlock");
    }else{
      // No PIN set up yet on the backend -> create it automatically.
      try{
        const ok=await setupPin(FIXED_PIN);
        if(ok){clearFails();onUnlock();return;}
      }catch(e){ /* fall through to manual setup screen */ }
      setMode("setup");
    }
  })().catch(e=>{toast(e.message||"Unable to connect to Supabase","error");setMode("setup")});},[]);

  useEffect(()=>{if(!lockUntil)return;const t=setInterval(()=>{
    setNow(Date.now());if(Date.now()>lockUntil){setLockUntil(null);clearFails();setFails(0)}
  },250);return()=>clearInterval(t)},[lockUntil]);

  const locked=!!lockUntil&&now<lockUntil,remain=locked?Math.max(0,lockUntil-now):0;
  const mm=String(Math.floor(remain/60000)).padStart(2,"0"),ss=String(Math.floor(remain%60000/1000)).padStart(2,"0");

  const submitSetup=async(pin,conf)=>{
    if(pin!==conf){setShake(true);setTimeout(()=>setShake(false),400);setConfirm(["","","",""]);setPhase("pin");setDigits(["","","",""]);toast("PINs do not match","error");return}
    setBusy(true);try{
      if(!/^\d{4}$/.test(pin))throw new Error("PIN must be exactly 4 digits");
      const ok=await setupPin(pin);
      if(!ok)throw new Error("PIN has already been created");
      clearFails();toast("PIN created","success");onUnlock();
    }catch(e){toast(e.message||"Unable to create PIN","error")}finally{setBusy(false)}
  };

  const submitUnlock=async(pin)=>{
    if(locked)return;setBusy(true);try{
      if(!/^\d{4}$/.test(pin))throw new Error("Enter your 4-digit PIN");
      const ok=await unlockWithPin(pin);
      if(!ok){
        const r=bumpFail();setFails(r.fails);if(r.lockedUntil)setLockUntil(r.lockedUntil);
        setShake(true);setTimeout(()=>setShake(false),400);setDigits(["","","",""]);refs.current[0]?.focus();toast(r.lockedUntil?"Too many attempts. Try again in 10 minutes.":"Incorrect PIN","error");return;
      }
      clearFails();setFails(0);toast("Unlocked","success");onUnlock();
    }catch(e){toast(e.message||"Unable to verify PIN","error");setShake(true);setTimeout(()=>setShake(false),400);setDigits(["","","",""])}
    finally{setBusy(false)}
  };

  const fill=(arr,i,val,setArr)=>{
    if(!/^\d?$/.test(val))return;const next=[...arr];next[i]=val;setArr(next);
    if(val&&i<3)refs.current[i+1+(phase==="confirm"?4:0)]?.focus();
    if(val&&i===3){const pin=next.join("");if(pin.length===4){
      if(mode==="setup"&&phase==="pin"){setPhase("confirm");setTimeout(()=>refs.current[4]?.focus(),50)}
      else if(mode==="setup")submitSetup(digits.join(""),pin);else submitUnlock(pin);
    }}
  };

  const onKey=(e,i)=>{
    if(e.key==="Backspace"&&!digits[i]&&i>0)refs.current[i-1]?.focus();
  };
  const onPaste=e=>{
    const text=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,4);if(text.length!==4)return;
    e.preventDefault();const a=text.split("");
    if(mode==="setup"&&phase==="confirm"){setConfirm(a);submitSetup(digits.join(""),text)}
    else{setDigits(a);if(mode==="unlock")submitUnlock(text);else{setPhase("confirm");setTimeout(()=>refs.current[4]?.focus(),50)}}
  };

  if(mode==="loading")return <div className="min-h-screen flex items-center justify-center bg-bg"><p className="text-muted">Loading…</p></div>;
  const boxes=mode==="setup"&&phase==="confirm"?confirm:digits;
  const setBoxes=mode==="setup"&&phase==="confirm"?setConfirm:setDigits;
  const offset=mode==="setup"&&phase==="confirm"?4:0;

  return <div className="min-h-screen flex items-center justify-center bg-bg p-6">
    <div className={`glass rounded-2xl p-8 w-full max-w-sm ${shake?"shake":""}`}>
      <div className="w-12 h-12 rounded-full bg-orange text-bg font-display font-extrabold flex items-center justify-center mb-6 mx-auto">PC</div>
      <h1 className="font-display text-xl font-bold text-center mb-1">{mode==="setup"?(phase==="pin"?"Create your admin PIN":"Confirm PIN"):"Admin unlock"}</h1>
      <p className="text-muted text-sm text-center mb-6">{mode==="setup"?"Create a 4-digit PIN for this admin panel.":"Enter your 4-digit PIN"}</p>
      {locked?<p className="text-center text-orange font-mono text-2xl font-bold">Locked {mm}:{ss}</p>:
      <div className="flex gap-3 justify-center" onPaste={onPaste}>
        {[0,1,2,3].map(i=><input key={i+offset} ref={el=>refs.current[i+offset]=el} className="digit-box" inputMode="numeric" pattern="[0-9]*" maxLength={1} value={boxes[i]} disabled={busy}
          onChange={e=>fill(boxes,i,e.target.value.replace(/\D/g,""),setBoxes)} onKeyDown={e=>onKey(e,i)} autoFocus={i===0}/>)}</div>}
      {!locked&&fails>0&&mode==="unlock"&&<p className="text-center text-sm text-muted mt-4">{fails}/5 failed attempts</p>}
      {busy&&<p className="text-center text-sm text-muted mt-4">Please wait…</p>}
    </div>
  </div>;
}

function Field({label,children}){return <label className="block mb-3"><span className="text-xs font-semibold text-muted uppercase tracking-wide">{label}</span><div className="mt-1">{children}</div></label>}
const inputCls="w-full px-3 py-2.5 rounded-xl bg-[#14110e] border border-white/10 text-cream text-sm min-h-[44px]";
function Btn({children,variant="primary",className="",...props}){
  const v=variant==="primary"?"bg-orange text-bg hover:bg-orange-deep":variant==="danger"?"bg-red-600/90 text-white":"bg-white/5 border border-white/10 text-cream hover:bg-white/10";
  return <button type="button" className={`inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-sm font-semibold min-h-[44px] disabled:opacity-50 ${v} ${className}`} {...props}>{children}</button>;
}
function TagInput({value,onChange,placeholder}){
  const[text,setText]=useState("");
  const add=()=>{const t=text.trim();if(!t)return;if(!value.includes(t))onChange([...value,t]);setText("")};
  return <div><div className="flex flex-wrap gap-2 mb-2">{value.map(t=><span key={t} className="text-xs px-2 py-1 rounded-full bg-orange/15 text-orange">{t} <button type="button" onClick={()=>onChange(value.filter(x=>x!==t))}>×</button></span>)}</div>
    <div className="flex gap-2"><input className={inputCls} value={text} placeholder={placeholder} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(e.preventDefault(),add())}/><Btn variant="ghost" onClick={add}>Add</Btn></div>
  </div>;
}
function ImagePicker({urls=[],cover="",onChange,onCover,multiple=true,prefix="uploads"}){
  const onFiles=async e=>{const files=[...(e.target.files||[])];e.target.value="";
    for(const file of files)try{const{dataUrl}=await processImageFile(file);const url=await uploadImage(dataUrl,prefix);const next=multiple?[...urls,url]:[url];onChange(next);if(!cover||!multiple)onCover(url);toast("Image uploaded","success")}catch(err){toast(err.message||"Upload failed","error")}
  };
  return <div><input type="file" accept="image/*" multiple={multiple} onChange={onFiles} className="text-sm text-muted mb-3"/>
    <div className="flex flex-wrap gap-3">{urls.map(u=><div key={u} className="relative w-24 h-24 rounded-lg overflow-hidden border border-white/10">
      <img src={u} alt="" className="w-full h-full object-cover"/><button type="button" className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70" onClick={()=>{const n=urls.filter(x=>x!==u);onChange(n);if(cover===u)onCover(n[0]||"")}}>×</button>
      {multiple&&<button type="button" className={`absolute bottom-1 left-1 text-[10px] px-1.5 py-0.5 rounded ${cover===u?"bg-orange text-bg":"bg-black/60"}`} onClick={()=>onCover(u)}>{cover===u?"Cover":"Set cover"}</button>}
    </div>)}</div>
  </div>;
}

function OverviewView({projects,unread}){
  const cards=[["Total Projects",projects.length],["Published",projects.filter(p=>p.status==="published").length],["Drafts",projects.filter(p=>p.status==="draft").length],["Featured",projects.filter(p=>p.featured).length],["Unread messages",unread]];
  return <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">{cards.map(([l,n])=><div key={l} className="glass rounded-2xl p-6"><p className="text-muted text-xs uppercase tracking-wide">{l}</p><p className="font-display text-3xl font-bold text-orange mt-2">{n}</p></div>)}</div>;
}

function ProjectsView({projects,reload,draftsOnly=false}){
  const list=draftsOnly?projects.filter(p=>p.status==="draft"):projects;const[edit,setEdit]=useState(null),[toolDraft,setToolDraft]=useState([]);
  const startNew=()=>{setEdit(emptyProject());setToolDraft([])};
  const startEdit=p=>{setEdit({...p,image_urls:p.image_urls||[],tools_used:p.tools_used||[]});setToolDraft(p.tools_used||[])};
  const save=async()=>{try{await requireSession();const payload={title:edit.title,description:edit.description,short_description:edit.short_description,category:edit.category,client_name:edit.client_name,image_url:edit.image_url,image_urls:edit.image_urls,tools_used:toolDraft,status:edit.status,is_visible:edit.is_visible,featured:edit.featured,display_order:Number(edit.display_order)||0};

  if(edit)return <div className="glass rounded-2xl p-6 max-w-2xl"><h2 className="font-display text-lg font-bold mb-4">{edit.id?"Edit project":"New project"}</h2>

    <Field label="Category"><select className={inputCls} value={edit.category} onChange={e=>setEdit({...edit,category:e.target.value})}>{["Logo","Branding","Social","Web"].map(c=><option key={c}>{c}</option>)}</select></Field>

    <Field label="Short description"><input className={inputCls} value={edit.short_description} onChange={e=>setEdit({...edit,short_description:e.target.value})}/></Field>

  </div>;
  return <div>{!draftsOnly&&<Btn className="mb-4" onClick={startNew}>+ New project</Btn>}<div className="space-y-3">{list.map(p=><div key={p.id} className="glass rounded-xl p-4 flex flex-wrap items-center gap-3 justify-between"><div><p className="font-semibold">{p.title}</p><p className="text-xs text-muted">{p.category} · {p.status}{p.featured?" · featured":""}</p></div><div className="flex gap-2">{draftsOnly&&<Btn variant="ghost" onClick={()=>publish(p)}>Publish</Btn>}<Btn variant="ghost" onClick={()=>startEdit(p)}>Edit</Btn><Btn variant="danger" onClick={()=>del(p.id)}>Delete</Btn></div></div>)}{!list.length&&<p className="text-muted">No items.</p>}</div></div>;
}

function SimpleCrud({table,rows,reload,fields,empty,titleKey="name"}){
  const[edit,setEdit]=useState(null);
  const save=async()=>{try{await requireSession();const{id,...rest}=edit;const r=id?await sb.from(table).update(rest).eq("id",id):await sb.from(table).insert(rest);if(r.error)throw r.error;toast("Saved","success");setEdit(null);reload()}catch(e){toast(e.message,"error")}};
  const del=async id=>{if(!confirm("Delete?"))return;try{await requireSession();const{error}=await sb.from(table).delete().eq("id",id);if(error)throw error;reload()}catch(e){toast(e.message,"error")}};
  if(edit)return <div className="glass rounded-2xl p-6 max-w-xl">{fields.map(f=><Field key={f.key} label={f.label}>
    {f.type==="textarea"?<textarea className={inputCls} rows="3" value={edit[f.key]??""} onChange={e=>setEdit({...edit,[f.key]:e.target.value})}/>:
    f.type==="checkbox"?<input type="checkbox" checked={!!edit[f.key]} onChange={e=>setEdit({...edit,[f.key]:e.target.checked})}/>:
    f.type==="tags"?<TagInput value={edit[f.key]||[]} onChange={v=>setEdit({...edit,[f.key]:v})} placeholder="Add"/>:
    f.type==="image"?<ImagePicker urls={edit[f.key]?[edit[f.key]]:[]} cover={edit[f.key]||""} multiple={false} prefix={f.prefix||"logos"} onChange={u=>setEdit({...edit,[f.key]:u[0]||""})} onCover={u=>setEdit({...edit,[f.key]:u})}/>:
    <input className={inputCls} type={f.type||"text"} value={edit[f.key]??""} onChange={e=>setEdit({...edit,[f.key]:e.target.value})}/>}
  </Field>)}<div className="flex gap-2 mt-4"><Btn onClick={save}>Save</Btn><Btn variant="ghost" onClick={()=>setEdit(null)}>Cancel</Btn></div></div>;
  return <div><Btn className="mb-4" onClick={()=>setEdit({...empty})}>+ New</Btn><div className="space-y-3">{rows.map(r=><div key={r.id} className="glass rounded-xl p-4 flex justify-between gap-3"><p className="font-semibold">{r[titleKey]}</p><div className="flex gap-2"><Btn variant="ghost" onClick={()=>setEdit({...r})}>Edit</Btn><Btn variant="danger" onClick={()=>del(r.id)}>Delete</Btn></div></div>)}</div></div>;
}

function ServicesView({rows,reload}){
  const[edit,setEdit]=useState(null);
  const save=async()=>{try{await requireSession();const{error}=await sb.from("services").update({title:edit.title,description:edit.description,icon:edit.icon,is_visible:edit.is_visible,display_order:Number(edit.display_order)||0}).eq("id",edit.id);if(error)throw error;toast("Updated","success");setEdit(null);reload()}catch(e){toast(e.message,"error")}};
  if(edit)return <div className="glass rounded-2xl p-6 max-w-xl"><Field label="Title"><input className={inputCls} value={edit.title} onChange={e=>setEdit({...edit,title:e.target.value})}/></Field><Field label="Description"><textarea className={inputCls} rows="3" value={edit.description} onChange={e=>setEdit({...edit,description:e.target.value})}/></Field><Field label="Icon"><input className={inputCls} value={edit.icon||""} onChange={e=>setEdit({...edit,icon:e.target.value})}/></Field><Field label="Order"><input type="number" className={inputCls} value={edit.display_order} onChange={e=>setEdit({...edit,display_order:e.target.value})}/></Field><label className="flex gap-2 mb-4"><input type="checkbox" checked={!!edit.is_visible} onChange={e=>setEdit({...edit,is_visible:e.target.checked})}/> Visible</label><div className="flex gap-2"><Btn onClick={save}>Save</Btn><Btn variant="ghost" onClick={()=>setEdit(null)}>Cancel</Btn></div></div>;
  return <div className="space-y-3"><p className="text-muted text-sm">Update only — services are seeded, not created or deleted.</p>{rows.map(r=><div key={r.id} className="glass rounded-xl p-4 flex justify-between"><div><span className="mr-2">{r.icon}</span><span className="font-semibold">{r.title}</span></div><Btn variant="ghost" onClick={()=>setEdit({...r})}>Edit</Btn></div>)}</div>;
}
function InboxView({rows,reload}){
  const toggle=async m=>{try{await requireSession();const{error}=await sb.from("contact_messages").update({is_read:!m.is_read}).eq("id",m.id);if(error)throw error;reload()}catch(e){toast(e.message,"error")}};
  const del=async id=>{if(!confirm("Delete message?"))return;try{await requireSession();const{error}=await sb.from("contact_messages").delete().eq("id",id);if(error)throw error;reload()}catch(e){toast(e.message,"error")}};
  return <div className="space-y-3">{rows.map(m=><div key={m.id} className={`glass rounded-xl p-4 ${!m.is_read?"border-orange/40":""}`}><div className="flex justify-between gap-2 flex-wrap"><div><p className="font-semibold">{m.name} {!m.is_read&&<span className="text-orange text-xs">· unread</span>}</p><p className="text-xs text-muted">{m.email}{m.phone?` · ${m.phone}`:""}</p></div><div className="flex gap-2"><Btn variant="ghost" onClick={()=>toggle(m)}>{m.is_read?"Mark unread":"Mark read"}</Btn><Btn variant="danger" onClick={()=>del(m.id)}>Delete</Btn></div></div><p className="text-sm mt-3 whitespace-pre-wrap">{m.message}</p><p className="text-xs text-muted mt-2">{m.created_at&&new Date(m.created_at).toLocaleString()}</p></div>)}{!rows.length&&<p className="text-muted">No messages.</p>}</div>;
}
function SettingsView({settings,reload}){
  const[s,setS]=useState(settings);useEffect(()=>setS(settings),[settings]);if(!s)return <p className="text-muted">No settings row. Run your seed SQL.</p>;
  const save=async()=>{try{await requireSession();const{id,created_at,updated_at,...rest}=s;const{error}=await sb.from("site_settings").update(rest).eq("id",id);if(error)throw error;toast("Settings saved","success");reload()}catch(e){toast(e.message,"error")}};
  return <div className="glass rounded-2xl p-6 max-w-xl">{[
    ["tagline","Tagline"],["whatsapp_url","WhatsApp URL"],["email","Email"],["phone","Phone"],["instagram_url","Instagram URL"],["linkedin_url","LinkedIn URL"]
  ].map(([k,l])=><Field key={k} label={l}><input className={inputCls} value={s[k]||""} onChange={e=>setS({...s,[k]:e.target.value})}/></Field>)}
  <label className="flex gap-2 text-sm mb-4"><input type="checkbox" checked={!!s.accepting_projects} onChange={e=>setS({...s,accepting_projects:e.target.checked})}/> Accepting projects</label>
  <div className="grid grid-cols-2 gap-3">{[["stat_projects","Projects Completed"],["stat_clients","Happy Clients"],["stat_years","Years Experience"],["stat_satisfaction","Satisfaction %"]].map(([k,l])=><Field key={k} label={l}><input type="number" className={inputCls} value={s[k]??0} onChange={e=>setS({...s,[k]:Number(e.target.value)})}/></Field>)}</div>
  <Btn className="mt-4" onClick={save}>Save settings</Btn></div>;
}
function LogView({rows}){return <div className="space-y-2">{rows.map(r=><div key={r.id} className="glass rounded-xl px-4 py-3 text-sm flex flex-wrap justify-between gap-2"><span className="text-orange font-semibold">{r.event}</span><span className="text-muted text-xs">{r.created_at&&new Date(r.created_at).toLocaleString()}</span><p className="w-full text-xs text-muted truncate">{r.user_agent}</p></div>)}{!rows.length&&<p className="text-muted">No events yet.</p>}</div>}

function AdminShell({onLock}){
  const[view,setView]=useState("overview"),[drawer,setDrawer]=useState(false),[projects,setProjects]=useState([]),
  [testimonials,setTestimonials]=useState([]),[posts,setPosts]=useState([]),[web,setWeb]=useState([]),[exp,setExp]=useState([]),
  [services,setServices]=useState([]),[messages,setMessages]=useState([]),[settings,setSettings]=useState(null),[logs,setLogs]=useState([]),
  idleTimer=useRef(null),unread=useMemo(()=>messages.filter(m=>!m.is_read).length,[messages]);

  const reload=useCallback(async()=>{
    try{
      await requireSession();
      const results=await Promise.all([
        sb.from("projects").select("*").order("display_order"),
        sb.from("testimonials").select("*").order("display_order"),
        sb.from("blog_posts").select("*").order("created_at",{ascending:false}),
        sb.from("web_projects").select("*").order("display_order"),
        sb.from("work_experience").select("*").order("display_order"),
        sb.from("services").select("*").order("display_order"),
        sb.from("contact_messages").select("*").order("created_at",{ascending:false}),
        sb.from("site_settings").select("*").limit(1).maybeSingle(),
        sb.from("admin_access_log").select("*").order("created_at",{ascending:false}).limit(100)
      ]);
      const errs=results.filter(r=>r.error);if(errs.length)throw errs[0].error;
      setProjects(results[0].data||[]);setTestimonials(results[1].data||[]);setPosts(results[2].data||[]);
      setWeb(results[3].data||[]);setExp(results[4].data||[]);setServices(results[5].data||[]);setMessages(results[6].data||[]);
      setSettings(results[7].data);setLogs(results[8].data||[]);
    }catch(e){console.error(e);if(e.message==="Unauthorized")onLock();else toast(e.message||"Could not load admin data","error")}
  },[onLock]);

  useEffect(()=>{reload()},[reload]);
  const resetIdle=useCallback(()=>{
    clearTimeout(idleTimer.current);idleTimer.current=setTimeout(async()=>{
      try{await logAccess("lock")}catch(e){}
      clearToken();onLock();
    },IDLE_MS);
  },[onLock]);
  useEffect(()=>{const ev=["mousemove","keydown","touchstart","click"];ev.forEach(e=>window.addEventListener(e,resetIdle));resetIdle();return()=>{ev.forEach(e=>window.removeEventListener(e,resetIdle));clearTimeout(idleTimer.current)}},[resetIdle]);
  const lock=async()=>{try{await logAccess("lock")}catch(e){}clearToken();onLock()};
  const nav=id=>{setView(id);setDrawer(false)};
  const NavItems=()=> <>{VIEWS.map(v=><button key={v.id} type="button" onClick={()=>nav(v.id)} className={`w-full text-left px-4 py-3 rounded-xl text-sm font-medium ${view===v.id?"bg-orange/20 text-orange":"text-cream/80 hover:bg-white/5"}`}>{v.label}{v.id==="inbox"&&unread>0&&<span className="ml-2 inline-flex items-center justify-center min-w-5 h-5 px-1 rounded-full bg-orange text-bg text-xs font-bold">{unread}</span>}</button>)}<a href="/" className="block px-4 py-3 text-sm text-muted hover:text-orange">← Public site</a><button type="button" onClick={lock} className="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 rounded-xl">Lock</button></>;

  return <div className="min-h-screen bg-bg flex">
    <aside className="hidden md:flex w-60 flex-col glass border-r border-white/10 p-4 sticky top-0 h-screen"><div className="flex items-center gap-2 mb-6 px-2"><div className="w-9 h-9 rounded-full bg-orange text-bg font-display font-extrabold text-sm flex items-center justify-center">PC</div><span className="font-display font-bold">Admin</span></div><nav className="flex-1 space-y-1 overflow-y-auto"><NavItems/></nav></aside>
    <div className="md:hidden fixed top-0 left-0 right-0 z-40 glass flex items-center justify-between px-4 h-14"><button type="button" aria-label="Menu" className="w-11 h-11 flex items-center justify-center" onClick={()=>setDrawer(true)}><span className="flex flex-col gap-1.5"><span className="block w-5 h-0.5 bg-cream"/><span className="block w-5 h-0.5 bg-cream"/><span className="block w-5 h-0.5 bg-cream"/></span></button><span className="font-display font-bold">Admin</span></div>
    {drawer&&<><div className="md:hidden fixed inset-0 bg-black/60 z-40" onClick={()=>setDrawer(false)}/><div className="md:hidden fixed top-0 left-0 z-50 w-[min(300px,85vw)] h-full glass p-4 pt-6 overflow-y-auto"><p className="font-display font-bold mb-4 px-2">Menu</p><NavItems/></div></>}
    <main className="flex-1 p-4 md:p-8 pt-20 md:pt-8 max-w-5xl w-full mx-auto"><h1 className="font-display text-2xl font-bold mb-6">{VIEWS.find(v=>v.id===view)?.label}</h1>
      {view==="overview"&&<OverviewView projects={projects} unread={unread}/>}
      {view==="projects"&&<ProjectsView projects={projects} reload={reload}/>}
      {view==="drafts"&&<ProjectsView projects={projects} reload={reload} draftsOnly/>}
      {view==="web"&&<SimpleCrud table="web_projects" rows={web} reload={reload} titleKey="name" empty={{name:"",description:"",live_url:"",logo_url:"",tech_stack:[],is_active:true,display_order:0}} fields={[
        {key:"name",label:"Name"},{key:"description",label:"Description",type:"textarea"},{key:"live_url",label:"Live URL"},
        {key:"logo_url",label:"Logo",type:"image",prefix:"logos"},{key:"tech_stack",label:"Tech stack",type:"tags"},{key:"display_order",label:"Order",type:"number"},{key:"is_active",label:"Active",type:"checkbox"}]}/>}
      {view==="experience"&&<SimpleCrud table="work_experience" rows={exp} reload={reload} titleKey="company" empty={{company:"",title:"",employment_type:"Full-time",location:"",start_date:"",end_date:"",logo_url:"",description:"",responsibilities:[],skills:[],display_order:0,is_published:true}} fields={[
        {key:"company",label:"Company"},{key:"title",label:"Title"},{key:"employment_type",label:"Employment type"},{key:"location",label:"Location"},
        {key:"start_date",label:"Start date",type:"date"},{key:"end_date",label:"End date",type:"date"},{key:"logo_url",label:"Logo",type:"image",prefix:"logos"},
        {key:"description",label:"Description",type:"textarea"},{key:"responsibilities",label:"Responsibilities",type:"tags"},{key:"skills",label:"Skills",type:"tags"},
        {key:"display_order",label:"Order",type:"number"},{key:"is_published",label:"Published",type:"checkbox"}]}/>}
      {view==="testimonials"&&<SimpleCrud table="testimonials" rows={testimonials} reload={reload} titleKey="name" empty={{name:"",role:"",quote:"",photo_url:"",display_order:0,is_visible:true}} fields={[
        {key:"name",label:"Name"},{key:"role",label:"Role"},{key:"quote",label:"Quote",type:"textarea"},{key:"photo_url",label:"Photo",type:"image",prefix:"avatars"},{key:"display_order",label:"Order",type:"number"},{key:"is_visible",label:"Visible",type:"checkbox"}]}/>}
      {view==="blog"&&<SimpleCrud table="blog_posts" rows={posts} reload={reload} titleKey="title" empty={{title:"",slug:"",excerpt:"",body:"",cover_image_url:"",is_published:false,published_at:null}} fields={[
        {key:"title",label:"Title"},{key:"slug",label:"Slug"},{key:"excerpt",label:"Excerpt",type:"textarea"},{key:"body",label:"Body",type:"textarea"},{key:"cover_image_url",label:"Cover",type:"image",prefix:"blog"},{key:"is_published",label:"Published",type:"checkbox"}]}/>}
      {view==="inbox"&&<InboxView rows={messages} reload={reload}/>}
      {view==="services"&&<ServicesView rows={services} reload={reload}/>}
      {view==="settings"&&<SettingsView settings={settings} reload={reload}/>}
      {view==="log"&&<LogView rows={logs}/>}
    </main>
  </div>;
}

function App(){
  const[pinAuthed,setPinAuthed]=useState(false);
  const lock=async()=>{await logoutAdmin();setPinAuthed(false);};
  if(!pinAuthed)return <PinGate onUnlock={()=>setPinAuthed(true)}/>;
  return <AdminShell onLock={lock}/>;
}

async function boot(){
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}

boot();
</script>
</body>
</html>

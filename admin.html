<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeCreatives Admin</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      bg:"#0a0806", card:"#1c1814", orange:"#f59e0b",
      "orange-deep":"#d97706", cream:"#faf6f1", muted:"#a89f94"
    },
    fontFamily:{sans:["Inter","system-ui","sans-serif"],display:["Sora","system-ui","sans-serif"]}
  }}
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0806;color:#faf6f1;font-family:Inter,system-ui,sans-serif}
.font-display{font-family:Sora,system-ui,sans-serif}.glass{background:rgba(28,24,20,.88);backdrop-filter:blur(16px);border:1px solid rgba(250,246,241,.1)}
.shake{animation:shake .4s ease}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
input,textarea,select,button{font-family:inherit}input:focus,textarea:focus,select:focus{outline:2px solid rgba(245,158,11,.45);outline-offset:1px}
.digit-box{width:3rem;height:3.5rem;text-align:center;font-size:1.5rem;font-weight:700;background:#14110e;border:1px solid rgba(250,246,241,.15);border-radius:.75rem;color:#faf6f1}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="env,react">
const SUPABASE_URL = "https://ilaetdddupayvtdaeewj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6HYx9w5kJkpytxuby9Ky3A_2vrsRpPA";
const FIXED_PIN = "0110";

const { useState, useEffect } = React;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth:{persistSession:true,autoRefreshToken:true}
});

function toast(msg,type="info"){\n  const el=document.createElement("div");el.textContent=msg;
  el.className="fixed bottom-6 right-6 z-[9999] px-4 py-3 rounded-xl text-sm font-medium shadow-lg "+
    (type==="error"?"bg-red-600 text-white":type==="success"?"bg-emerald-600 text-white":"bg-[#1c1814] text-[#faf6f1] border border-white/10");
  document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
}

async function ensureAnonymousAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session)return session;
  const {data,error}=await sb.auth.signInAnonymously();
  if(error)throw new Error("Enable Anonymous Sign-Ins in Supabase first.");
  return data.session;
}

async function unlockWithPin(pin){
  const {data,error}=await sb.rpc("admin_verify_pin",{p_pin:pin});
  if(error)throw error;
  return data===true;
}

async function setupPin(pin){
  const {data,error}=await sb.rpc("admin_setup_pin",{p_pin:pin});
  if(error)throw error;
  return data===true;
}

async function hasActiveAdminSession(){
  try{
    const {data,error}=await sb.rpc("admin_is_admin_session");
    if(error)return false;
    return data===true;
  }catch(e){return false}
}

function PinGate({onUnlock}){
  const[mode,setMode]=useState("loading");
  const[digits,setDigits]=useState(["","","",""]);
  const[busy,setBusy]=useState(false);

  useEffect(()=>{(async()=>{
    await ensureAnonymousAuth();
    if(await hasActiveAdminSession()){onUnlock();return;}
    const{data,error}=await sb.rpc("admin_has_pin");
    if(error)throw error;
    if(data===true){
      try{
        const ok=await unlockWithPin(FIXED_PIN);
        if(ok){onUnlock();return;}
      }catch(e){}
      setMode("unlock");
    }else{
      try{
        const ok=await setupPin(FIXED_PIN);
        if(ok){onUnlock();return;}
      }catch(e){}
      setMode("setup");
    }
  })().catch(e=>{toast(e.message||"Error","error");setMode("unlock")});},[onUnlock]);

  const submit=async()=>{
    const pin=digits.join("");
    if(!/^\\d{4}$/.test(pin)){toast("Enter 4 digits","error");return;}
    setBusy(true);
    try{
      const ok=await unlockWithPin(pin);
      if(!ok){toast("Incorrect PIN","error");setDigits(["","","",""]);return;}
      toast("Unlocked!","success");
      onUnlock();
    }catch(e){toast(e.message||"Error","error");}
    finally{setBusy(false)}
  };

  if(mode==="loading")return <div className="min-h-screen flex items-center justify-center bg-bg"><p className="text-muted">Loading…</p></div>;
  
  return <div className="min-h-screen flex items-center justify-center bg-bg p-6">
    <div className="glass rounded-2xl p-8 w-full max-w-sm">
      <div className="w-12 h-12 rounded-full bg-orange text-bg font-display font-extrabold flex items-center justify-center mb-6 mx-auto">PC</div>
      <h1 className="font-display text-xl font-bold text-center mb-1">Admin Unlock</h1>
      <p className="text-muted text-sm text-center mb-6">Enter your 4-digit PIN</p>
      <div className="flex gap-2 justify-center mb-6">
        {[0,1,2,3].map(i=><input key={i} className="digit-box" inputMode="numeric" maxLength="1" value={digits[i]} onChange={e=>{const n=[...digits];n[i]=e.target.value.replace(/\\D/g,"").slice(0,1);setDigits(n);}} disabled={busy}/>)}
      </div>
      <button className="w-full px-4 py-2.5 bg-orange text-bg rounded-full font-semibold disabled:opacity-50" onClick={submit} disabled={busy||digits.join("").length!==4}>{busy?"Please wait…":"Unlock"}</button>
    </div>
  </div>;
}

function AdminDashboard({onLock}){
  const[view,setView]=useState("overview");
  const[data,setData]=useState({projects:[],services:[],messages:[]});
  const[loading,setLoading]=useState(true);

  useEffect(()=>{loadData();},[]);

  const loadData=async()=>{
    try{
      setLoading(true);
      const p=await sb.from("projects").select("*").order("display_order");
      const s=await sb.from("services").select("*").order("display_order");
      const m=await sb.from("contact_messages").select("*").order("created_at",{ascending:false});
      setData({projects:p.data||[],services:s.data||[],messages:m.data||[]});
    }catch(e){toast(e.message,"error");}
    finally{setLoading(false)}
  };

  const lock=async()=>{await sb.auth.signOut();onLock();};

  if(loading)return <div className="min-h-screen flex items-center justify-center bg-bg"><p className="text-muted">Loading…</p></div>;

  return <div className="min-h-screen bg-bg">
    <header className="glass border-b border-white/10 p-4 sticky top-0">
      <div className="max-w-5xl mx-auto flex justify-between items-center">
        <h1 className="font-display font-bold text-lg">PrimeCreatives Admin</h1>
        <button onClick={lock} className="text-red-400 text-sm font-semibold hover:bg-white/5 px-4 py-2 rounded-lg">Lock</button>
      </div>
    </header>

    <nav className="glass border-b border-white/10 p-4 sticky top-16">
      <div className="max-w-5xl mx-auto flex gap-2 overflow-x-auto">
        {["overview","projects","services","messages"].map(v=><button key={v} onClick={()=>setView(v)} className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap ${view===v?"bg-orange/20 text-orange":"text-muted hover:bg-white/5"}`}>{v.charAt(0).toUpperCase()+v.slice(1)}</button>)}
      </div>
    </nav>

    <main className="max-w-5xl mx-auto p-4 md:p-8">
      {view==="overview"&&<div className="grid grid-cols-3 gap-4"><div className="glass rounded-xl p-6"><p className="text-muted text-xs mb-2">Total Projects</p><p className="font-display text-3xl text-orange">{data.projects.length}</p></div><div className="glass rounded-xl p-6"><p className="text-muted text-xs mb-2">Services</p><p className="font-display text-3xl text-orange">{data.services.length}</p></div><div className="glass rounded-xl p-6"><p className="text-muted text-xs mb-2">Messages</p><p className="font-display text-3xl text-orange">{data.messages.length}</p></div></div>}
      
      {view==="projects"&&<div className="space-y-3"><h2 className="font-display text-xl font-bold mb-4">Projects ({data.projects.length})</h2>{data.projects.map(p=><div key={p.id} className="glass rounded-xl p-4"><p className="font-semibold">{p.title}</p><p className="text-xs text-muted">{p.category} · {p.status}</p></div>)}{!data.projects.length&&<p className="text-muted">No projects yet.</p>}</div>}
      
      {view==="services"&&<div className="space-y-3"><h2 className="font-display text-xl font-bold mb-4">Services ({data.services.length})</h2>{data.services.map(s=><div key={s.id} className="glass rounded-xl p-4"><p className="font-semibold">{s.title}</p><p className="text-xs text-muted">{s.description}</p></div>)}{!data.services.length&&<p className="text-muted">No services yet.</p>}</div>}
      
      {view==="messages"&&<div className="space-y-3"><h2 className="font-display text-xl font-bold mb-4">Contact Messages ({data.messages.length})</h2>{data.messages.map(m=><div key={m.id} className="glass rounded-xl p-4"><p className="font-semibold">{m.name}</p><p className="text-xs text-muted">{m.email}</p><p className="text-sm mt-2">{m.message}</p></div>)}{!data.messages.length&&<p className="text-muted">No messages yet.</p>}</div>}
    </main>
  </div>;
}

function App(){
  const[authed,setAuthed]=useState(false);
  return authed?<AdminDashboard onLock={()=>setAuthed(false)}/>:<PinGate onUnlock={()=>setAuthed(true)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
